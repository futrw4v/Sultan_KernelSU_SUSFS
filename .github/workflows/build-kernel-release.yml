name: Build and Release Sultan Kernels

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
  
on:
  workflow_dispatch:
        
jobs:  
  build-kernel-zuma:
    uses: ./.github/workflows/sultan.yml
    secrets: inherit
    with:
      codename: "zuma"
      android_version: "android14"
      kernel_version: "6.1"

  trigger-release:
    runs-on: ubuntu-latest
    needs:
        - build-kernel-zuma
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "Pixel 8 (Zuma) Sultan + KSU Next + SUSFS + PWM Mod"
      RELEASE_NOTES: |
        This release contains KernelSU Next and SUSFS v2.1.0
        
        ### 📦 Variants Included:
        * **stock**: The pure, unmodified base Sultan kernel. Built straight from source with no extra patches or additions.
        * **wksu**: Includes Wild KernelSU (WKSU) integrated into the kernel. No other modifications.
        * **wksu-susfs**: The ultimate package. Includes KernelSU Next, SUSFS v2.1.0, and extra custom configurations (Mountify support, networking tweaks, BBR TCP congestion, and IPSet support).
        
        ⚠️ **COMPATIBILITY NOTICE** ⚠️
        Please ensure compatibility!
        
        **Sultan Commits Used:**
        -> https://github.com/kerneltoast/android_kernel_google_tensynos/commit/TENSYNOS_HASH
        
        Module: 
        -> https://github.com/sidex15/ksu_module_susfs
        
        Managers:
        -> https://github.com/KernelSU-Next/KernelSU-Next
        
        Features:
        [+] KernelSU Next
        [+] SUSFS v2.1.0
        [+] Mountify Support
        [+] BBR TCP Congestion Control
        [+] IPSet Support

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Get the Latest Tag from GitHub
      - name: Generate and Create New Tag
        run: |
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            LATEST_TAG="v1.0.0-r0"
          fi
          
          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG
            
      # Download Artifacts for A12 (Only if A12 Build is successful or input is true or empty)
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Create GitHub Release and Upload
        run: |
          mkdir -p ./release-assets
          find ./downloaded-artifacts -type f -name "*.zip" -exec cp {} ./release-assets/ \;
          
          echo "Uploading the following files to release:"
          ls -lh ./release-assets/

          gh release create "$NEW_TAG" ./release-assets/*.zip \
            --title "$RELEASE_NAME ($NEW_TAG)" \
            --notes "$RELEASE_NOTES"
